<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pegasus - Interface Corrigida</title>
<style>
  /* =========================================
     RESET E ESTILOS GLOBAIS
  ========================================= */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #0b1a2e; /* Cor de fundo característica do projeto */
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* =========================================
     COMPONENTE 1: CABEÇALHO (Mensagens)
  ========================================= */
  .header-container {
    display: flex;
    flex-direction: column;
    max-width: 600px; /* Limite de largura para manter o layout elegante */
  }

  .header-subtitle {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: bold;
    margin-bottom: 8px;
    color: #e0e0e0;
  }

  .header-main {
    display: flex;
    align-items: center;
    justify-content: space-between; /* Mantém o título à esquerda e botões à direita */
    gap: 20px; /* Previne que o título encoste nos botões em ecrãs menores */
  }

  .header-title {
    font-family: Georgia, serif; /* Fonte serifada conforme a imagem */
    font-size: 38px;
    font-weight: normal;
  }

  .header-buttons {
    display: flex;
    align-items: center;
    gap: 10px; /* Espaçamento uniforme entre os ícones */
  }
  
  /* Botões gerais do cabeçalho */
  .btn-icon {
    background-color: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    transition: background-color 0.2s;
    font-size: 16px;
  }

  .btn-icon:hover {
    background-color: rgba(255, 255, 255, 0.1);
  }

  /* Botão principal de ação (+) */
  .btn-primary {
    background-color: #b5dbff;
    color: #0b1a2e;
    border: none;
    font-size: 24px;
    font-weight: normal;
  }

  .btn-primary:hover {
    background-color: #9acaf5;
  }

  /* =========================================
     COMPONENTE 2: PERFIL DO UTILIZADOR
  ========================================= */
  .profile-section {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 20px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    max-width: 600px;
  }

  .profile-info {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .profile-avatar {
    background-color: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 22px;
  }

  .profile-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .profile-name {
    font-weight: 600;
    font-size: 16px;
  }

  .profile-email {
    font-size: 13px;
    color: #a3b1c6;
  }

  /* Contentor para empilhar os botões de ação à direita */
  .profile-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end; 
    gap: 10px; /* Espaçamento vertical que impede a sobreposição */
  }

  .profile-actions-top {
    display: flex;
    gap: 10px;
  }

  .btn-small {
    width: 36px;
    height: 36px;
    border-radius: 10px;
  }

  /* Botão em formato de pílula (Conversa privada) */
  .btn-pill {
    background-color: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 12px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s;
  }

  .btn-pill:hover {
    background-color: rgba(255, 255, 255, 0.05);
  }

</style>
</head>
<body>

  <!-- =========================================
       Cabeçalho de Mensagens
  ========================================= -->
  <header class="header-container">
    <div class="header-subtitle">Seu Espaço</div>
    <div class="header-main">
      <h1 class="header-title">Mensagens</h1>
      <div class="header-buttons">
        <button class="btn-icon" aria-label="Ação especial">✨</button>
        <button class="btn-icon" aria-label="Parar">⏹</button>
        <button class="btn-icon" aria-label="Mensagem">✉</button>
        <button class="btn-icon btn-primary" aria-label="Nova Mensagem">+</button>
      </div>
    </div>
  </header>

  <!-- =========================================
       Seção de Perfil e Ações
  ========================================= -->
  <section class="profile-section">
    <div class="profile-info">
      <div class="profile-avatar">NM</div>
      <div class="profile-text">
        <p class="profile-name">Nathan Moreira Ramos</p>
        <p class="profile-email">nathanpyelgeme@gmail.com</p>
      </div>
    </div>
    
    <div class="profile-actions">
      <div class="profile-actions-top">
        <button class="btn-icon btn-small" aria-label="Pesquisar">🔍</button>
        <button class="btn-icon btn-small" aria-label="Configurações">⌖</button>
      </div>
      <button class="btn-pill">
        <span>✧</span> Conversa privada
      </button>
    </div>
  </section>

</body>
</html>
