<path d="M188 92 L193 43 Q201 33 210 72 L216 101 Z" fill="url(#face)" stroke="#DDF5FF" stroke-width="4" stroke-linejoin="round"/>
<path d="M197 76 L200 60 Q205 63 207 81Z" fill="#9AAFC5"/>
<!-- cavalo branco perfil voltado para direita: testa, focinho, boca, mandíbula, pescoço -->
<path d="M182 73 Q203 68 215 86 Q224 98 231 121 Q235 139 245 152 Q256 161 272 169 Q284 174 282 186 Q281 201 270 210 Q253 221 228 207 Q215 206 204 215 Q197 232 181 245 Q157 259 130 257 Q154 229 160 210 Q173 183 173 160 Q164 133 169 106 Q169 87 182 73Z" fill="url(#face)" stroke="#EFFBFF" stroke-width="4" stroke-linejoin="round"/>
<!-- contorno anatômico -->
<path d="M200 91 Q218 119 214 146 M226 200 Q239 207 251 209 M191 214 Q179 232 161 245" fill="none" stroke="#A1BED6" stroke-width="3" opacity=".65"/>
<!-- crina à frente da testa -->
<path d="M179 78 Q162 91 154 111 Q173 99 182 110 Q161 124 157 148 Q176 126 192 127 Q203 103 197 81Z" fill="url(#mane)" stroke="#B7E7FF" stroke-width="2"/>
<path d="M174 85 Q154 107 146 127 M171 108 Q161 125 152 144" fill="none" stroke="#A7E2FF" stroke-width="3" stroke-linecap="round"/>
<!-- olho sério com sobrancelha inclinada -->
<path d="M215 136 Q225 128 236 133" fill="none" stroke="#284260" stroke-width="5" stroke-linecap="round"/>
<path d="M214 144 Q225 149 236 143 Q229 157 219 153 Z" fill="#173450"/>
<circle cx="225" cy="146" r="3.5" fill="#061B36"/>
<circle cx="224" cy="145" r="1" fill="white"/>
<!-- narina e boca -->
<path d="M266 181 Q270 179 275 184 Q270 186 265 184Z" fill="#526B80"/>
<path d="M248 201 Q261 205 270 199" fill="none" stroke="#607E91" stroke-width="2.8" stroke-linecap="round"/>
<!-- asa exclusivamente ABAIXO do rosto -->
<path d="M172 246 Q136 247 101 225 Q76 219 42 219 Q59 242 84 250 Q63 249 37 249 Q61 275 94 277 Q79 289 64 291 Q102 309 148 291 Q182 282 209 261" fill="url(#wing)" stroke="#D7F1FF" stroke-width="4" stroke-linejoin="round"/>
<path d="M169 256 Q130 253 74 236 M160 267 Q116 269 56 259 M149 278 Q122 291 87 291" fill="none" stroke="#6FB1E8" stroke-width="4" stroke-linecap="round"/>
</svg>
