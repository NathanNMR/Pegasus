<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Pegasus — rosto de perfil</title><desc id="desc">Rosto de cavalo alado branco de perfil olhando seriamente para a direita, com crina azul e uma asa abaixo.</desc>
<defs>
  <linearGradient id="face" x1="100" y1="60" x2="261" y2="251" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".58" stop-color="#EDF7FF"/><stop offset="1" stop-color="#BDD8ED"/></linearGradient>
  <linearGradient id="mane" x1="86" y1="50" x2="183" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#83D6FF"/><stop offset=".5" stop-color="#377CCE"/><stop offset="1" stop-color="#142F70"/></linearGradient>
  <linearGradient id="wing" x1="73" y1="236" x2="245" y2="310" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFEFF"/><stop offset="1" stop-color="#65AEF0"/></linearGradient>
</defs>
<!-- crina longa: atrás do pescoço e da cabeça -->
<path d="M185 62 Q141 52 125 74 Q106 102 108 132 Q85 147 75 181 Q101 169 113 181 Q91 199 82 217 Q113 199 135 220 Q115 241 114 255 Q156 235 168 223 L222 143 Z" fill="url(#mane)" stroke="#8AD3FF" stroke-width="3"/>
